# =========================================================
# APPLICATION
# =========================================================

spring.application.name=error-free-campus
server.port=8080


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/error_free_campus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Postgres@123}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =========================================================
# JWT SECURITY
# =========================================================

jwt.secret=${JWT_SECRET:errorfreecampussecretkey2024verylongstringforhmacsha256algorithm}
jwt.expiration=86400000


# =========================================================
# AI CONFIGURATION
# =========================================================

ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent}
ai.model=gemini-pro


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# LOGGING
# =========================================================

logging.level.com.college=INFO
logging.level.org.springframework.security=WARN